# RLUNet Experiment Configuration (Placeholder)

experiment_name: "rlunet_baseline"
seed: 42

# Dataset Configuration
data:
  dataset_name: "Kalantari17"
  data_root: "data/processed"
  layout: "folders"
  val_count: 300
  crop_size: 256
  batch_size: 8
  num_workers: 4

# Model Configuration
model:
  name: "RLUNet"
  in_channels: 3
  out_channels: 3
  base_channels: 32

# Training Hyperparameters
train:
  epochs: 100
  learning_rate: 0.0002
  lr_decay_step: 40
  lr_gamma: 0.5
  weight_decay: 0.0001
  loss_type: "l1_mu_law"  # e.g., tone-mapped L1 loss

# Logging & Checkpoints
logging:
  save_dir: "models/checkpoints"
  log_interval: 10
  save_freq_epochs: 5
